apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-yaml
  namespace: safebox-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-yaml

  template:
    metadata:
      labels:
        app: hello-yaml

    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
